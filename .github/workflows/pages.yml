name: Deploy guide to GitHub Pages

# Pages is set to "Deploy from a branch" (main, root), so this only runs by hand.
# To publish just app/ instead, set Settings > Pages > Source to "GitHub Actions"
# and add back a push trigger on main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Publish only the app folder, so the PDFs and screenshots in the repo are not served.
      - name: Stage site
        run: |
          mkdir _site
          cp -R app/. _site/
          sed -i "s/const CACHE = \"guide-dev\";/const CACHE = \"guide-${GITHUB_SHA::12}\";/" _site/sw.js
          grep -q "guide-${GITHUB_SHA::12}" _site/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
